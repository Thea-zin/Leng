<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leng - Court Booking System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎾 Leng Court Booking System</h1>
            <p>Book your favorite court online</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="booking">New Booking</button>
            <button class="tab-btn" data-tab="view">View Bookings</button>
        </div>

        <!-- Booking Form Tab -->
        <div id="booking" class="tab-content active">
            <div class="card">
                <h2>Make a Reservation</h2>
                <form id="bookingForm">
                    <div class="form-group">
                        <label for="customer_name">Your Name *</label>
                        <input type="text" id="customer_name" name="customer_name" required>
                    </div>

                    <div class="form-group">
                        <label for="customer_email">Email *</label>
                        <input type="email" id="customer_email" name="customer_email" required>
                    </div>

                    <div class="form-group">
                        <label for="court_id">Select Court *</label>
                        <select id="court_id" name="court_id" required>
                            <option value="">-- Select a Court --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="booking_date">Date *</label>
                        <input type="date" id="booking_date" name="booking_date" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="start_time">Start Time *</label>
                            <input type="time" id="start_time" name="start_time" required>
                        </div>

                        <div class="form-group">
                            <label for="end_time">End Time *</label>
                            <input type="time" id="end_time" name="end_time" required>
                        </div>
                    </div>

                    <div id="message" class="message"></div>

                    <button type="submit" class="btn btn-primary">Book Now</button>
                </form>
            </div>
        </div>

        <!-- View Bookings Tab -->
        <div id="view" class="tab-content">
            <div class="card">
                <h2>Current Bookings</h2>
                <div id="bookingsList">
                    <p class="loading">Loading bookings...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
